name: Deploy AI OPC ONE to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unified React site
        run: |
          npm ci
          npm run build

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp dist/index.html _site/index.html
          for page in assistant community map mine news projects skills tools; do cp dist/index.html "_site/$page.html"; done
          cp CNAME _site/CNAME
          touch _site/.nojekyll
          cp -R assets _site/assets
          cp -R dist/assets/* _site/assets/
          if [ -d dist/media ]; then cp -R dist/media _site/media; fi
          cp privacy.html terms.html disclaimer.html content-policy.html assets-license.html _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
