    <script>
      window.addEventListener('DOMContentLoaded',function(){
        var installCopilot=function(){
          var page=document.querySelector('.assistant-page');
          var shell=page && page.querySelector('.chat-shell');
          if(!shell || shell.dataset.smartCopilot==='true'){return;}
          shell.dataset.smartCopilot='true';
          shell.innerHTML='<section class="smart-copilot" aria-label="OPC 智能创业助手"><aside class="smart-copilot__side"><span class="eyebrow">PLANNING CONTEXT</span><label>所在城市<select data-copilot-city><option>北京</option><option>杭州</option><option>深圳</option><option>上海</option><option>成都</option><option>其他城市</option></select></label><label>当前阶段<select data-copilot-stage><option value="验证">验证方向</option><option value="获客">寻找客户</option><option value="交付">稳定交付</option><option value="增长">扩大增长</option></select></label><span class="eyebrow">QUICK START</span><div class="smart-copilot__prompts"><button class="smart-copilot__prompt" data-prompt="我想用 AI 做一个人公司，帮我制定 7 天验证计划">7 天验证一个 AI 方向</button><button class="smart-copilot__prompt" data-prompt="帮我找适合深圳一人公司的资源和下一步行动">匹配本地创业资源</button><button class="smart-copilot__prompt" data-prompt="我有一个 AI 自动化服务想法，如何找到第一位付费客户">获得首位付费客户</button></div></aside><main class="smart-copilot__main"><div class="smart-copilot__status"><b>OPC 智能规划</b><span><i></i>本地规划引擎已就绪</span></div><div class="smart-copilot__messages" data-copilot-messages><section class="copilot-welcome"><b>从一个可验证的结果开始</b><p>填写城市与阶段，再说明你想做的事、时间或当前卡点。我会输出今天可执行的一步、7 天验证计划和匹配方向。</p><small class="smart-copilot__disclosure">建议基于本地规则和当前页面资源生成，不代替政策、合同或投资决策。</small></section></div><form class="smart-copilot__composer" data-copilot-form><textarea required aria-label="输入创业目标" placeholder="例如：我在杭州，会用 ComfyUI，想在 7 天内验证一个 AI 内容服务"></textarea><button type="submit">生成计划</button></form></main></section>';
          var messages=shell.querySelector('[data-copilot-messages]'), form=shell.querySelector('[data-copilot-form]'), input=form.querySelector('textarea'), city=shell.querySelector('[data-copilot-city]'), stage=shell.querySelector('[data-copilot-stage]');
          var escape=function(value){var el=document.createElement('div');el.textContent=value;return el.innerHTML;};
          var makePlan=function(query){
            var q=query.toLowerCase(), cityName=city.value, stageName=stage.value, focus=q.includes('客户')||q.includes('获客')||q.includes('销售')?'首位付费客户':q.includes('资源')||q.includes('场地')||q.includes('政策')?'本地资源匹配':q.includes('自动化')||q.includes('n8n')||q.includes('dify')?'自动化服务验证':'最小可行服务验证';
            var steps=focus==='首位付费客户'?[['今天','明确报价','写出一页服务说明：对象、交付、周期、价格。'],['第 3 天','访谈 5 人','找 5 位目标客户，记录原话和高频问题。'],['第 7 天','拿到承诺','发出 3 份明确邀约，目标获得 1 次付费试单。']]:focus==='本地资源匹配'?[['今天','确定筛选条件','明确办公、算力、项目或资金中的首要需求。'],['第 3 天','锁定 3 个节点',cityName+' 优先查看创业空间、行业活动和公开服务窗口。'],['第 7 天','完成 1 次对接','预约一次线下或线上咨询，记录政策与入驻条件。']]:focus==='自动化服务验证'?[['今天','选择单一场景','只选一个重复动作，例如线索分流或内容初稿。'],['第 3 天','做可演示原型','用现有工具完成一个 3 分钟演示，不追求全功能。'],['第 7 天','找真实使用者','邀请 3 人试用，用使用反馈决定是否继续。']]:[['今天','压缩目标','把问题改成 7 天内能验证的单一结果。'],['第 3 天','做最小交付','用现有技能完成一个可展示样本。'],['第 7 天','验证需求','找 3 位潜在用户，收集愿不愿意付费的反馈。']];
            return {focus:focus,steps:steps};
          };
          var submit=function(query){if(!query.trim()){return;}var plan=makePlan(query);messages.insertAdjacentHTML('beforeend','<div class="copilot-user">'+escape(query)+'</div><section class="copilot-answer"><h3>'+escape(plan.focus)+' · '+escape(city.value)+' · '+escape(stage.value)+'阶段</h3><p>先把今天的第一步做成可交付的结果，再根据真实反馈决定是否扩大投入。</p><div class="copilot-steps">'+plan.steps.map(function(step,i){return '<div class="copilot-step"><small>0'+(i+1)+' / '+escape(step[0])+'</small><b>'+escape(step[1])+'</b><span>'+escape(step[2])+'</span></div>';}).join('')+'</div><div class="copilot-actions"><button type="button" data-save-plan>保存行动计划</button><button type="button" data-use-prompt>继续细化</button></div></section>');messages.scrollTop=messages.scrollHeight;input.value='';};
          form.addEventListener('submit',function(event){event.preventDefault();submit(input.value);});
          shell.addEventListener('click',function(event){var prompt=event.target.closest('[data-prompt]');if(prompt){input.value=prompt.dataset.prompt;input.focus();submit(input.value);return;}if(event.target.closest('[data-save-plan]')){localStorage.setItem('opc_copilot_plan',messages.innerText);event.target.closest('[data-save-plan]').textContent='已保存到我的 OPC';event.target.closest('[data-save-plan]').className='smart-copilot__saved';return;}if(event.target.closest('[data-use-prompt]')){input.value='请把第 1 步拆成今天 30 分钟内可以完成的任务';input.focus();}});
        };
        new MutationObserver(installCopilot).observe(document.getElementById('root'),{childList:true,subtree:true});
        installCopilot();
        var mountAvatarLoop=function(hero){
          if(!hero || hero.querySelector('.hero-avatar-video')){return Boolean(hero);}
          var original=hero.querySelector('video:not(.hero-space-video)');
          if(!original){return false;}
          var avatar=document.createElement('video');
          avatar.className='hero-avatar-video';
          avatar.src=original.currentSrc || original.src;
          avatar.autoplay=true;
          avatar.defaultMuted=true;
          avatar.muted=true;
          avatar.loop=true;
          avatar.playsInline=true;
          avatar.preload='auto';
          avatar.setAttribute('aria-label','AI 人形动态展示');
          avatar.addEventListener('canplay',function(){avatar.play().catch(function(){});},{once:true});
          avatar.addEventListener('ended',function(){avatar.currentTime=0;avatar.play().catch(function(){});});
          original.replaceWith(avatar);
          avatar.play().catch(function(){});
          return true;
        };
        var mountHeroBackground=function(){
          var hero=document.querySelector('.marketing-hero');
          if(!hero){return false;}
          if(hero.querySelector('.hero-space-video')){mountAvatarLoop(hero);return true;}
          var video=document.createElement('video');
          video.className='hero-space-video';
          video.src='assets/hero-ambient.mp4';
          video.autoplay=true;
          video.muted=true;
          video.volume=.32;
          video.loop=true;
          video.playsInline=true;
          video.preload='auto';
          video.setAttribute('aria-hidden','true');
          hero.appendChild(video);
          video.play().catch(function(){});
          var soundButton=document.createElement('button');
          soundButton.type='button';
          soundButton.className='hero-sound-toggle';
          soundButton.textContent='开启声音';
          soundButton.setAttribute('aria-label','开启背景视频声音');
          soundButton.title='开启背景视频声音';
          soundButton.addEventListener('click',function(){
            video.muted=!video.muted;
            video.volume=.32;
            video.play().catch(function(){});
            var isPlaying=!video.muted;
            soundButton.textContent=isPlaying?'关闭声音':'开启声音';
            soundButton.setAttribute('aria-label',isPlaying?'关闭背景视频声音':'开启背景视频声音');
            soundButton.title=isPlaying?'关闭背景视频声音':'开启背景视频声音';
            soundButton.classList.toggle('is-playing',isPlaying);
          });
          hero.appendChild(soundButton);
          mountAvatarLoop(hero);
          return true;
        };
        if(!mountHeroBackground()){
          var heroTimer=window.setInterval(function(){if(mountHeroBackground()){window.clearInterval(heroTimer);}},50);
          window.setTimeout(function(){window.clearInterval(heroTimer);},4000);
        }
        var ticker=document.querySelector('.opc-place-ticker');
        if(ticker){
          var mountTicker=function(){
            var hero=document.querySelector('.marketing-hero');
            if(!hero){return false;}
            window.setTimeout(function(){hero.appendChild(ticker);},200);
            return true;
          };
          if(!mountTicker()){
            var tickerTimer=window.setInterval(function(){if(mountTicker()){window.clearInterval(tickerTimer);}},50);
            window.setTimeout(function(){window.clearInterval(tickerTimer);},4000);
          }
        }
        document.querySelectorAll('[data-opc-place-link]').forEach(function(link){link.addEventListener('click',function(event){event.preventDefault();var target=[].find.call(document.querySelectorAll('button'),function(button){return button.textContent.trim()==='找资源'});if(target){target.click();}})});
      });
    </script>
</body>
</html>
